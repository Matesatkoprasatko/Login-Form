<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form a Javacsript</title>
    <link rel="stylesheet" href="./style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira+Stencil:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Login Form</h1>
    <form action="" method="GET">
        <label for="email">Emailová adresa</label>
        <input placeholder="jan@novak.cz" type="email" id="email" name="email" required>

        <label for="password">Heslo</label>
        <input placeholder="minimálně 8 znaků" type="password" minlength="8" id="password", name="password" required>

        <div class="button-container">
            <button type="submit">Přihlásit</button>
            <button id="loadBtn">Vyplnit</button>
            <button id="clearBtn">Resetovat</button>
        </div>
    </form>
    <script src="./script.js"></script>
</body>
</html>
